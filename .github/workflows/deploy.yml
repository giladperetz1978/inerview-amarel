name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        env:
          GEMINI_KEY: ${{ secrets.AI_GEMINI_KEY }}
          CLOUD_KEY: ${{ secrets.AI_CLOUD_KEY }}
        run: |
          sed -i "s!AI_GEMINI_KEY_PLACEHOLDER!$GEMINI_KEY!g" js/chat.js
          sed -i "s!AI_CLOUD_KEY_PLACEHOLDER!$CLOUD_KEY!g" js/chat.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
