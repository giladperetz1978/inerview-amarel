name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        run: |
          sed -i 's|AI_GEMINI_KEY_PLACEHOLDER|'${{ secrets.AI_GEMINI_KEY }}'|g' js/chat.js
          sed -i 's|AI_CLOUD_KEY_PLACEHOLDER|'${{ secrets.AI_CLOUD_KEY }}'|g' js/chat.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
