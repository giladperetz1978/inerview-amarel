name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        env:
          GEMINI_KEY: ${{ secrets.AI_GEMINI_KEY }}
          CLOUD_KEY: ${{ secrets.AI_CLOUD_KEY }}
        run: |
          python3 -c "
          import os
          f_path = 'js/chat.js'
          with open(f_path, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('AI_GEMINI_KEY_PLACEHOLDER', os.environ.get('GEMINI_KEY', ''))
          c = c.replace('AI_CLOUD_KEY_PLACEHOLDER', os.environ.get('CLOUD_KEY', ''))
          with open(f_path, 'w', encoding='utf-8') as f:
              f.write(c)
          "

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          force: true
