name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        shell: bash
        run: |
          KEY_VAL="${{ secrets.AI_CLOUD_KEY }}"
          echo "Processing AI_CLOUD_KEY..."
          sed -i "s/AI_CLOUD_KEY_PLACEHOLDER/$KEY_VAL/g" js/chat.js
          
          GEM_VAL="${{ secrets.AI_GEMINI_KEY }}"
          sed -i "s/AI_GEMINI_KEY_PLACEHOLDER/$GEM_VAL/g" js/chat.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          force: true
